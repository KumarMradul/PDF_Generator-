<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Smart Question Formatter PRO (Watermark Edition)</title>
    
    <!-- गणित (Maths) को प्रोफेशनल बनाने के लिए MathJax स्क्रिप्ट -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        window.MathJax = { 
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>

    <style>
        /* स्क्रीन पर दिखने वाला डिज़ाइन (UI) */
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .control-panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .control-panel h2 { margin-top: 0; color: #333; }
        label { font-weight: bold; margin-top: 10px; display: block; }
        input[type="text"], textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 130px; font-family: monospace; }
        
        /* बटन्स का डिज़ाइन */
        .btn-group { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        button { background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; }
        .btn-success:hover { background-color: #218838; }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #c82333; }
        
        /* PDF पेज का डिज़ाइन */
        #print-area { 
            background: white; 
            padding: 40px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            min-height: 500px; 
            display: none; 
            position: relative; 
            overflow: hidden; 
        }
        
        /* वॉटरमार्क (ताकि हर पेज पर तिरछा Basic Concept लिखा आए) */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-35deg);
            font-size: 85px;
            font-weight: bold;
            color: rgba(200, 200, 200, 0.22); /* बहुत हल्का ग्रे रंग */
            white-space: nowrap;
            z-index: 0;
            pointer-events: none;
            user-select: none;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        /* कंटेंट को वॉटरमार्क के ऊपर रखने के लिए */
        .columns-container, .header-wrapper, .type-wrapper {
            position: relative;
            z-index: 1;
        }
        
        /* टॉपिक और टाइप के कंटेनर (बाईं तरफ) */
        .header-wrapper { margin-top: 20px; margin-bottom: 5px; page-break-inside: avoid; }
        .type-wrapper { margin-bottom: 25px; page-break-inside: avoid; }
        
        .header-title { text-align: left; font-size: 24px; font-weight: bold; text-decoration: underline; text-transform: uppercase; }
        .header-type { text-align: left; font-size: 18px; font-weight: bold; color: #555; }
        
        /* 2-कॉलम लेआउट */
        .columns-container { 
            column-count: 2; 
            column-gap: 40px; 
            column-rule: 2px solid black; 
        }
        
        .question-block { page-break-inside: avoid; margin-bottom: 30px; line-height: 1.5; position: relative; }
        
        /* डिलीट और एडिट बटन का स्टाइल */
        .delete-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            padding: 2px 6px;
        }
        .delete-btn:hover { background: #cc0000; }

        .edit-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: #ffc107;
            color: black;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            padding: 2px 6px;
            font-weight: bold;
        }
        .edit-btn:hover { background: #e0a800; }

        /* रंगों की सेटिंग: इंग्लिश काली, हिंदी लाल */
        .eng-text { color: black; font-weight: bold; margin-bottom: 4px; }
        .hin-text { color: red; margin-bottom: 4px; }
        
        .tag-container { text-align: right; margin-bottom: 8px; }
        .tag { color: black; font-weight: bold; font-size: 12px; background-color: #e0e0e0; padding: 2px 6px; border-radius: 3px; }
        .options-table { width: 100%; color: black; font-weight: bold; margin-top: 5px; }
        .options-table td { width: 50%; padding: 3px 0; vertical-align: middle; }

        /* प्रिंट करते समय सिर्फ print-area दिखेगा और बटन्स छिप जाएंगे */
        @media print {
            body { background: white; margin: 0; padding: 0; }
            .control-panel { display: none; } 
            .delete-btn, .edit-btn { display: none !important; }
            #print-area { display: block; box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <h2>📚 Smart Question Formatter to PDF</h2>
        
        <label for="topic">Topic (विषय):</label>
        <input type="text" id="topic" placeholder="e.g., Classification of Number">
        
        <label for="type">Type (प्रकार):</label>
        <input type="text" id="type" placeholder="e.g., TYPE - I">
        
        <label for="rawText">Questions Paste Here (एक या एक से ज़्यादा प्रश्न पेस्ट करें):</label>
        <p style="font-size: 12px; color: #666; margin-top: 0;"><i>नोट: इंग्लिश लाइन के बाद <b>Enter</b> दबाकर हिंदी को नीचे रखें। मैथ के फॉर्मूले <b>$</b> के बीच लिखें।</i></p>
        <textarea id="rawText" placeholder="32. $(142^2 - 1)$ is divisible by:&#10;$(142^2 - 1)$ से विभाज्य है:&#10;[SSC CGL 2023]&#10;(a) 19 (b) 7 (c) 9 (d) 13"></textarea>
        
        <div class="btn-group">
            <button onclick="addQuestions()">➕ Add Question / Section</button>
            <button class="btn-success" onclick="window.print()">🖨️ Download .PDF</button>
            <button class="btn-danger" onclick="clearPreview()">🗑️ Clear All</button>
        </div>
    </div>

    <!-- यह हिस्सा PDF में छपेगा -->
    <div id="print-area">
        <!-- बैकग्राउंड वॉटरमार्क -->
        <div class="watermark">Basic Concept</div>

        <div class="columns-container" id="questions-container">
            <!-- यहाँ टॉपिक्स, टाइप्स और प्रश्न लाइन-बाय-लाइन जुड़ते जाएंगे -->
        </div>
    </div>

    <script>
        function addQuestions() {
            let topicVal = document.getElementById('topic').value.trim();
            let typeVal = document.getElementById('type').value.trim();
            let rawText = document.getElementById('rawText').value.trim();
            let container = document.getElementById('questions-container');
            
            if(topicVal === "" && typeVal === "" && rawText === "") {
                alert("कृपया पहले कुछ डेटा दर्ज करें!");
                return;
            }

            // 1. नया Topic जोड़ें (Edit बटन के साथ)
            if(topicVal !== "") {
                let topicId = 'topic-' + Date.now();
                let topicHTML = `
                <div class="header-wrapper" id="${topicId}">
                    <button class="edit-btn" onclick="editHeader('${topicId}-text', 'topic')">✏️ Edit</button>
                    <div class="header-title" id="${topicId}-text">${topicVal}</div>
                </div>`;
                container.innerHTML += topicHTML;
                document.getElementById('topic').value = ""; 
            }

            // 2. नया Type जोड़ें (Edit बटन के साथ)
            if(typeVal !== "") {
                let typeId = 'type-' + Date.now();
                let typeHTML = `
                <div class="type-wrapper" id="${typeId}">
                    <button class="edit-btn" onclick="editHeader('${typeId}-text', 'type')">✏️ Edit</button>
                    <div class="header-type" id="${typeId}-text">${typeVal}</div>
                </div>`;
                container.innerHTML += typeHTML;
                document.getElementById('type').value = ""; 
            }

            // 3. प्रश्न जोड़ें
            if(rawText !== "") {
                let rawQuestions = rawText.split(/(?:^|[\r\n]+|\s+)(?=\d+\.)/g).filter(q => q.trim().length > 0);
                
                rawQuestions.forEach(qBlock => {
                    qBlock = qBlock.trim();
                    
                    let tagMatch = qBlock.match(/\[.*?\]/);
                    let tag = tagMatch ? tagMatch[0] : "";
                    if(tag) qBlock = qBlock.replace(tag, "").trim(); 
                    
                    let optionsHtml = "";
                    let aIndex = qBlock.search(/\(a\)/i);
                    if(aIndex !== -1) {
                        let optString = qBlock.substring(aIndex);
                        qBlock = qBlock.substring(0, aIndex).trim(); 
                        
                        let a = optString.match(/\(a\)\s*(.*?)\s*(?=\(b\))/si);
                        let b = optString.match(/\(b\)\s*(.*?)\s*(?=\(c\))/si);
                        let c = optString.match(/\(c\)\s*(.*?)\s*(?=\(d\))/si);
                        let d = optString.match(/\(d\)(.*)/si);
                        
                        let valA = a ? a[1].trim() : "";
                        let valB = b ? b[1].trim() : "";
                        let valC = c ? c[1].trim() : "";
                        let valD = d ? d[1].trim() : "";
                        
                        optionsHtml = `<table class="options-table">
                            <tr><td>(a) ${valA}</td><td>(b) ${valB}</td></tr>
                            <tr><td>(c) ${valC}</td><td>(d) ${valD}</td></tr>
                        </table>`;
                    }

                    let lines = qBlock.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                    let engText = [];
                    let hinText = [];
                    let hindiRegex = /[\u0900-\u097F]/; 

                    lines.forEach(line => {
                        if (hindiRegex.test(line)) {
                            hinText.push(line);
                        } else {
                            engText.push(line);
                        }
                    });

                    let blockId = 'q-' + Date.now() + Math.random().toString(36).substr(2, 5);

                    let questionHTML = `
                    <div class="question-block" id="${blockId}">
                        <button class="delete-btn" onclick="document.getElementById('${blockId}').remove()">❌ Delete</button>
                        ${engText.length > 0 ? `<div class="eng-text">${engText.join("<br>")}</div>` : ''}
                        ${hinText.length > 0 ? `<div class="hin-text">${hinText.join("<br>")}</div>` : ''}
                        ${tag ? `<div class="tag-container"><span class="tag">${tag}</span></div>` : ''}
                        ${optionsHtml}
                    </div>`;
                    
                    container.innerHTML += questionHTML;
                });
                document.getElementById('rawText').value = "";
            }

            document.getElementById('print-area').style.display = 'block';

            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        function editHeader(textId, inputFieldId) {
            let currentText = document.getElementById(textId).innerText;
            document.getElementById(inputFieldId).value = currentText;
            document.getElementById(textId).closest('.header-wrapper, .type-wrapper').remove();
        }

        function clearPreview() {
            if (confirm("क्या आप सच में सभी प्रश्नों को मिटाना चाहते हैं?")) {
                document.getElementById('questions-container').innerHTML = "";
                document.getElementById('print-area').style.display = 'none';
            }
        }
    </script>
</body>
</html>
